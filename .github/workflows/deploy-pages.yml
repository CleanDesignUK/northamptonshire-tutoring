name: Publish Northamptonshire Tutoring to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate website
        run: python scripts/check_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website files
        run: |
          mkdir -p _site
          cp -R *.html assets blog locations data _site/
          for file in robots.txt sitemap.xml .nojekyll favicon.ico favicon.svg; do
            if [ -f "$file" ]; then cp "$file" _site/; fi
          done
          test -f _site/index.html
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
